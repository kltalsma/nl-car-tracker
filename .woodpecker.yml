# Woodpecker CI Pipeline for NL Car Tracker
# https://woodpecker-ci.org/docs/usage/intro

# Run on all events by default - filter per-step as needed
when:
  - event: [pull_request, manual, push]

steps:
  # Install dependencies and run tests (runs on all branches)
  test:
    image: python:3.11-slim
    commands:
      # Install system dependencies for scraping (selenium, chromium)
      - apt-get update
      - apt-get install -y --no-install-recommends chromium chromium-driver tesseract-ocr
      
      # Install Python dependencies
      - pip install --upgrade pip
      - pip install -r requirements.txt
      
      # Run tests
      - echo "Running RDW lookup test..."
      - python test_rdw_lookup.py || echo "RDW test completed with status $?"
      
      - echo "Running Vandenbrug scraper test..."
      - python test_vandenbrug.py || echo "Vandenbrug test completed with status $?"
      
      # Run pytest if any test files exist
      - |
        if [ -d "tests" ] || ls test_*.py 2>/dev/null | grep -q .; then
          echo "Running pytest..."
          pytest -v || echo "Pytest completed with status $?"
        fi

  # Build Docker images (runs on main and feature/* branches)
  build-docker:
    image: docker:24-dind
    privileged: true
    when:
      - event: pull_request
        branch: [main, master, feature/*]
      - event: manual
      - event: push
        branch: master
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - echo "Building Docker image..."
      - docker build -t nl-car-tracker:${CI_COMMIT_SHA:0:8} .
      - docker tag nl-car-tracker:${CI_COMMIT_SHA:0:8} nl-car-tracker:latest
      - echo "Docker image built successfully"
      - docker images | grep nl-car-tracker

  # Lint and code quality checks (runs on all branches)
  lint:
    image: python:3.11-slim
    commands:
      - pip install flake8 black
      - echo "Running flake8..."
      - flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true
      - echo "Checking code formatting with black..."
      - black --check . || echo "Code formatting check completed"

  # Deploy to production (only on push to master)
  deploy:
    image: docker:24-dind
    privileged: true
    when:
      - event: push
        branch: master
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - echo "Deploying to production..."
      - cd /home/kltalsma/nl-car-tracker
      - docker-compose down
      - docker-compose up -d --build
      - echo "Deployment completed successfully"
      - docker-compose ps
