services:
  # Web dashboard service
  web:
    build: .
    container_name: nl-car-tracker-web
    ports:
      - "5001:5002"
    volumes:
      # Mount all code directories directly into /app
      - ./app:/app/app
      - ./scrapers:/app/scrapers
      - ./models:/app/models
      - ./utils:/app/utils
      - ./migrations:/app/migrations
      - ./scripts:/app/scripts
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config.yaml:/app/config.yaml
      - ./run_scraper.py:/app/run_scraper.py
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DISABLE_SCHEDULER=true
    command: python app/app.py
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - car-tracker-network

  # Scraper service (continuous background scraping)
  scraper:
    build: .
    container_name: nl-car-tracker-scraper
    volumes:
      # Mount all code directories directly into /app
      - ./app:/app/app
      - ./scrapers:/app/scrapers
      - ./models:/app/models
      - ./utils:/app/utils
      - ./migrations:/app/migrations
      - ./scripts:/app/scripts
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config.yaml:/app/config.yaml
      - ./run_scraper.py:/app/run_scraper.py
    environment:
      - PYTHONUNBUFFERED=1
    command: python run_scraper.py
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - car-tracker-network
    depends_on:
      - web

volumes:
  data:
    driver: local
  logs:
    driver: local

networks:
  car-tracker-network:
    driver: bridge
